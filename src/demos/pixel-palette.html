<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Palette</title>
<script id="localdeck-manifest" type="application/json">{"schemaVersion":1,"title":"Pixel Palette","type":"tool","genre":"Design","description":"Generate harmonious color palettes. Lock the colors you like, press space for new ones, click to copy hex codes.","tags":["demo","design","colors"],"controls":["keyboard","mouse","touch"]}</script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; background: #111; color: #fff; font: 15px/1.4 system-ui, -apple-system, Segoe UI, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 18px; background: #18181b; border-bottom: 1px solid #ffffff14; }
  header h1 { margin: 0 auto 0 0; font-size: 18px; }
  select, button, input[type=color] { height: 38px; border: 1px solid #ffffff26; border-radius: 10px; background: #27272a; color: #fff; font: 600 14px system-ui; padding: 0 12px; cursor: pointer; }
  input[type=color] { width: 46px; padding: 4px; }
  button.primary { border: 0; background: #fafafa; color: #111; }
  .swatches { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); }
  .sw { position: relative; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 10px; padding: 24px 8px; cursor: pointer; transition: flex .3s; }
  .sw .hex { font: 700 20px ui-monospace, Consolas, monospace; letter-spacing: .04em; }
  .sw .name { font-size: 12px; opacity: .75; }
  .sw .lock { width: 40px; height: 40px; border: 0; border-radius: 50%; background: #0002; color: inherit; font-size: 18px; }
  .sw .lock.on { background: #0005; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 40px); padding: 10px 16px; border-radius: 12px; background: #fff; color: #111; font-weight: 700; opacity: 0; transition: .25s; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 640px) { .swatches { grid-template-columns: 1fr; } .sw { flex-direction: row; justify-content: space-between; padding: 14px 18px; } }
</style>
</head>
<body>
<header>
  <h1>Pixel Palette</h1>
  <input type="color" id="base" value="#8b5cf6" aria-label="Base color">
  <select id="mode" aria-label="Harmony"><option value="analogous">Analogous</option><option value="complementary">Complementary</option><option value="triadic">Triadic</option><option value="monochrome">Monochrome</option><option value="random">Random</option></select>
  <button id="copyAll">Copy CSS</button>
  <button class="primary" id="gen">Generate (space)</button>
</header>
<div class="swatches" id="sw"></div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
let colors = [], locked = [false, false, false, false, false];
const hexToHsl = hex => { let r = parseInt(hex.slice(1, 3), 16) / 255, g = parseInt(hex.slice(3, 5), 16) / 255, b = parseInt(hex.slice(5, 7), 16) / 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b); let h = 0, s = 0, l = (mx + mn) / 2; if (mx !== mn) { const d = mx - mn; s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn); h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; } return [h, s * 100, l * 100]; };
const hsl = (h, s, l) => { h = ((h % 360) + 360) % 360; s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l), f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1)); return '#' + [f(0), f(8), f(4)].map(v => Math.round(v * 255).toString(16).padStart(2, '0')).join(''); };
const names = ['Ink', 'Dusk', 'Bloom', 'Mist', 'Glow', 'Haze', 'Ember', 'Tide', 'Moss', 'Plum', 'Sand', 'Frost'];
function generate() {
  const [h, s, l] = hexToHsl($('base').value), m = $('mode').value, j = () => Math.random() * 10 - 5;
  const sets = {
    analogous: [-40, -20, 0, 20, 40].map((d, i) => hsl(h + d + j(), s, [30, 45, l, 65, 80][i])),
    complementary: [hsl(h, s, 25), hsl(h, s, l), hsl(h, s * .4, 85), hsl(h + 180 + j(), s, l), hsl(h + 180, s, 30)],
    triadic: [hsl(h, s, l), hsl(h + 120 + j(), s, l), hsl(h + 240 + j(), s, l), hsl(h, s * .3, 90), hsl(h, s, 18)],
    monochrome: [15, 32, 50, 68, 86].map(L => hsl(h, s, L + j() / 2)),
    random: Array.from({ length: 5 }, () => hsl(Math.random() * 360, 45 + Math.random() * 45, 25 + Math.random() * 55)),
  };
  colors = sets[m].map((c, i) => locked[i] && colors[i] ? colors[i] : c);
  render();
}
const lum = hex => { const [, , l] = hexToHsl(hex); return l; };
function render() {
  $('sw').innerHTML = colors.map((c, i) => `<div class="sw" data-i="${i}" style="background:${c};color:${lum(c) > 60 ? '#111' : '#fff'}"><button class="lock ${locked[i] ? 'on' : ''}" data-lock="${i}" title="Lock color" aria-label="Lock color ${i + 1}">${locked[i] ? '🔒' : '🔓'}</button><span class="hex">${c.toUpperCase()}</span><span class="name">${names[(parseInt(c.slice(1), 16) >> 4) % names.length]}</span></div>`).join('');
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1400); }
async function copy(text, label) { try { await navigator.clipboard.writeText(text); toast(`${label} copied`); } catch { toast(text); } }
$('sw').onclick = e => { const lock = e.target.dataset.lock; if (lock !== undefined) { locked[lock] = !locked[lock]; render(); return; } const sw = e.target.closest('.sw'); if (sw) copy(colors[sw.dataset.i].toUpperCase(), colors[sw.dataset.i].toUpperCase()); };
$('gen').onclick = generate; $('mode').onchange = generate; $('base').oninput = generate;
$('copyAll').onclick = () => copy(':root {\n' + colors.map((c, i) => `  --color-${i + 1}: ${c};`).join('\n') + '\n}', 'CSS variables');
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); generate(); } });
generate();
</script>
</body>
</html>
