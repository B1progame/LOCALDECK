<!doctype html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C12" />
    <meta name="description" content="A private, offline-first library for learning, games, tools, and HTML projects." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>LocalDeck — Your library, all yours</title>
    <script>
      // Apply the saved theme before first paint (mirrors applyAppearance in src/theme.ts).
      (function () {
        try {
          var v = JSON.parse(localStorage.getItem('localdeck-appearance') || 'null') || {};
          var t = v.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'pearl' : 'obsidian';
          var r = document.documentElement;
          r.dataset.theme = t;
          r.style.colorScheme = t === 'pearl' ? 'light' : 'dark';
          if (/^#[0-9a-f]{6}$/i.test(v.accent || '')) {
            var n = parseInt(v.accent.slice(1), 16), R = (n >> 16) & 255, G = (n >> 8) & 255, B = n & 255;
            r.style.setProperty('--accent', v.accent);
            r.style.setProperty('--accent-rgb', R + ' ' + G + ' ' + B);
            r.style.setProperty('--on-accent', (0.2126 * R + 0.7152 * G + 0.0722 * B) / 255 > 0.55 ? '#14111F' : '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
