<!doctype html>
<html lang="en" data-theme="obsidian">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0C12" />
    <meta name="description" content="A private, offline-first library for learning, games, tools, and HTML projects." />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <title>LocalDeck: your offline library</title>
    <script>
      // Set the saved theme before first paint. src/main.tsx applies the accent before React renders.
      (function () {
        try {
          var v = JSON.parse(localStorage.getItem('localdeck-appearance') || 'null') || {};
          var t = v.theme || 'system';
          if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'pearl' : 'obsidian';
          var r = document.documentElement;
          r.dataset.theme = t;
          r.style.colorScheme = t === 'pearl' ? 'light' : 'dark';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
