name = "localdeck-share"
main = "worker/src/index.ts"
compatibility_date = "2026-11-23"

[[d1_databases]]
binding = "SHARES_DB"
database_name = "localdeck-shares"
database_id = "820402d4-769e-47c0-ace4-4ce9a5f50e65"

# More room for projects: every free database holds 500 MB.
[[d1_databases]]
binding = "PROJECTS_DB_2"
database_name = "localdeck-projects-2"
database_id = "3422bfdf-beeb-45ed-b114-0d7630cfddea"

[[d1_databases]]
binding = "PROJECTS_DB_3"
database_name = "localdeck-projects-3"
database_id = "c4a4ee49-37b3-493a-a492-e155d0e28f8c"

[[kv_namespaces]]
binding = "SHARES_KV"
id = "5a3acea628dd43fa956ead4900871c4b"
preview_id = "cca8b6d1388c464da7f6b4cb64e96539"

[triggers]
crons = ["17 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://b1progame.github.io,http://localhost:5468"
APP_URL = "https://b1progame.github.io/LOCALDECK/"

[observability]
enabled = true

[observability.logs]
enabled = true
# The address of an AI connection contains its secret, so addresses must not be logged.
invocation_logs = false
